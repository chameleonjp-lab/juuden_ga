name: Verify and publish game Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'chameleonjp-lab/juuden_ga'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          clean: false
      - name: Verify static game and social metadata without game execution
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { Script } = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const head = html.slice(0, html.indexOf('</head>'));
          assert.match(html, /充電ｶﾞｯ/u);
          const canonical = [...head.matchAll(/<link rel="canonical" href="([^"]+)">/g)].map(m => m[1]);
          assert.deepEqual(canonical, ['https://chameleonjp-lab.github.io/juuden_ga/']);
          const metadata = [...head.matchAll(/<meta (?:name|property)="((?:og|twitter):[^"]+)" content="([^"]+)">/g)].map(m => m.slice(1,3));
          assert.equal(metadata.length, 14);
          const fields = Object.fromEntries(metadata);
          assert.equal(Object.keys(fields).length, metadata.length);
          assert.equal(fields['og:title'], '充電ｶﾞｯ');
          assert.equal(fields['twitter:title'], '充電ｶﾞｯ');
          assert.equal(fields['og:url'], 'https://chameleonjp-lab.github.io/juuden_ga/');
          assert.equal(fields['og:image'], 'https://chameleonjp-lab.github.io/juuden_ga/social-card-7233a01f.jpg');
          assert.equal(fields['twitter:image'], fields['og:image']);
          assert.equal(fields['twitter:card'], 'summary_large_image');
          assert.equal(fields['og:image:type'], 'image/jpeg');
          assert.equal(fields['og:image:width'], '1200');
          assert.equal(fields['og:image:height'], '630');
          const image = fs.readFileSync('social-card-7233a01f.jpg');
          assert.equal(image.readUInt16BE(0), 0xffd8);
          assert.equal(image.readUInt16BE(image.length-2), 0xffd9);
          assert.equal(createHash('sha256').update(image).digest('hex'), '7233a01f294713cae58dbb344bb25aa446c1ac01e7ad53f9af0b4ca152bb5e88');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          assert.equal(scripts.length, 2);
          assert.equal(scripts.filter(([, attrs]) => /\bsrc=/.test(attrs)).length, 1);
          for (const [, attrs, source] of scripts) {
            if (/\bsrc=/.test(attrs)) assert.match(attrs, /^ src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2(?:\/dist\/umd\/supabase\.min\.js)?"\s*$/);
            else new Script(source);
          }
          assert.match(html, /GAME_SLUG\s*=\s*"juden_ga"/);
          assert.equal(html.includes('https://chameleonjp.codeberg.page/juden_ga/'), false);
          console.log('Verified unique canonical, static social card, exact JPEG, syntax and stable game identity.');
          NODE
      - name: Build only the two public runtime files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          site="$(mktemp -d "$RUNNER_TEMP/game-pages.XXXXXX")"
          files=( index.html social-card-7233a01f.jpg )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" || -L "$file" ]]; then
              echo "Runtime file must be nonempty, regular, and not a symlink: $file" >&2
              exit 1
            fi
            install -m 0644 -- "$file" "$site/$file"
            cmp -- "$file" "$site/$file"
          done
          test "$(find "$site" -type f | wc -l)" -eq "${#files[@]}"
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload only the verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.package.outputs.path }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chameleonjp-lab/juuden_ga'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy only the artifact verified from this commit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
